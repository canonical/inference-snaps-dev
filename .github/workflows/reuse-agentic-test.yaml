# This reusable workflow runs the AI (agentic) snap test via Workshop & OpenCode.
# It is intended to be called by a snap repository's workflow.

name: AI Snap Test via Workshop & OpenCode

on:
  workflow_call:
    inputs:
      snap-name:
        description: Name of the snap to test
        required: true
        type: string
      snap-channel:
        description: Snap Store channel to test
        required: false
        type: string
        default: edge
      openrouter-model:
        description: OpenRouter model to use for the testing agent
        required: false
        type: string
        default: deepseek/deepseek-v4-flash
      issue-repo:
        description: Repository where GitHub issues are filed for new findings
        required: false
        type: string
        default: canonical/inference-snaps
      create-issues:
        description: Automatically file GitHub issues for NEW findings in the tracker repo or label existing ones
        required: false
        type: boolean
        default: false
    secrets:
      openrouter-api-key:
        description: OpenRouter API key used by the testing agent
        required: true
      issue-create-token:
        description: GitHub token used to create issues in the issue tracker repo
        required: true

jobs:
  ai-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev/tests/agentic
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Launch Workshop
        uses: canonical/launch-workshop@v1
        with:
          project: dev/tests/agentic

      # Phase 1: run the testing agent and produce snap-test-report.json.
      # Exposes `error_count` and `verdict` outputs consumed by later steps.
      - name: Run OpenCode Testing Agent
        id: test
        env:
          SNAP_NAME: ${{ inputs.snap-name }}
          SNAP_CHANNEL: ${{ inputs.snap-channel }}
          OPENROUTER_API_KEY: ${{ secrets.openrouter-api-key }}
          OPENROUTER_MODEL: ${{ inputs.openrouter-model }}
        run: ./test.sh

      # Phase 2: triage the error findings against open issues, producing
      # snap-triage-report.json. Only runs when the test found error findings.
      - name: Triage findings
        id: triage
        if: steps.test.outputs.error_count > 0
        env:
          OPENROUTER_API_KEY: ${{ secrets.openrouter-api-key }}
          OPENROUTER_MODEL: ${{ inputs.openrouter-model }}
        run: ./triage.sh

      # Phase 3: print, create and cross-snap-label GitHub issues from the
      # triage report. Only runs when triage produced a report.
      - name: File and label GitHub issues
        if: steps.test.outputs.error_count > 0 && steps.triage.outcome == 'success'
        env:
          SNAP_NAME: ${{ inputs.snap-name }}
          CREATE_ISSUES: ${{ inputs.create-issues }}
          ISSUE_REPO: ${{ inputs.issue-repo }}
          ISSUE_CREATE_TOKEN: ${{ secrets.issue-create-token }}
        run: ./issues.sh

      # Always tear the workshop down, regardless of earlier failures.
      - name: Remove workshop
        if: always()
        working-directory: dev/tests/agentic
        run: workshop remove || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snap-test-reports
          path: |
            dev/tests/agentic/snap-test-report.json
            dev/tests/agentic/snap-triage-report.json
          if-no-files-found: warn

      # Fail the job if the testing agent's verdict was not PASS. Runs last so
      # the reports above are always uploaded first, even on failure.
      - name: Enforce test verdict
        if: always()
        working-directory: dev/tests/agentic
        run: |
          if [[ "${{ steps.test.outputs.verdict }}" != "PASS" ]]; then
            echo "Test FAILED (verdict: ${{ steps.test.outputs.verdict }})" >&2
            exit 1
          fi

