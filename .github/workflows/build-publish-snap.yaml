name: Build and publish snap

on:
  workflow_call:
    inputs:
      build-sha:
        # When triggered by pull_request_target, checkout PR's HEAD (rather than base), otherwise use github.sha
        required: true
        type: string
      publish-channel:
        required: true
        type: string
      init-build-script:
        description: If set, run this script before building the snap. It initializes the build environment, like downloading resources.
        required: false
        type: string
    secrets:
      store-credentials:
        required: true

jobs:
  build:
    name: Build & publish
    strategy:
      fail-fast: false
      matrix:
        runs:
          - architecture: amd64
            runner: [ self-hosted, linux, amd64, xlarge, noble ]
          - architecture: arm64
            runner: [ self-hosted, linux, arm64, xlarge, noble ]
    runs-on: ${{ matrix.runs.runner }}

    steps:
      # Update snapd as we need a recent one to support components
      - name: Update snapd
        run: |
          sudo snap refresh snapd

      - name: Install Git LFS
        run: sudo apt-get update && sudo apt-get install -y git-lfs

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true
          submodules: true
          ref: ${{ inputs.build-sha }}

      - name: Init build environment
        run: |
          if [ -n "${{ inputs.init-build-script }}" ]; then
            ./"${{ inputs.init-build-script }}"
          fi

      - name: Build snap
        uses: canonical/action-build@v1

      - name: Publish snap
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.store-credentials }}     
        run: |
          channel="${{ inputs.publish-channel }}"
          echo -e "Channel:\n\t$channel"

          snap_file="$(ls *.snap)"
          snap_size=$(du -h "$snap_file" | cut -f1)
          echo -e "Snap file:\n\t$snap_file $snap_size"

          # Build components argument list
          component_args=()
          echo "Snap components:"
          for comp_file in *.comp; do
              comp_size=$(du -h "$comp_file" | cut -f1)

              # Component file name patterns:
              # <snap_name>+<comp_name>_<comp_version>.comp
              # <snap_name>+<comp_name>.comp
              comp_name=$(echo "$comp_file" | 
                  cut -d'+' -f2 | # drop snap name
                  cut -d'.' -f1 | # drop file extension
                  cut -d'_' -f1) # split by _, take 1st part

              echo -e "\t$comp_file $comp_size"

              component_args+=(--component "$comp_name=$comp_file")
          done

          echo -e "\nUploading snap..."
          set -x
          snapcraft upload "$snap_file" "${component_args[@]}" --release="$channel"
