name: Build and publish snap

on:
  workflow_call:
    inputs:
      runner:
        description: |
          The type of machine to run the job on.
          
          The input should be a JSON string or array. For example:
          - '"ubuntu-latest"' for a single label
          - '[ "self-hosted", "amd64", "large" ]' for multiple labels

          Note: Using GH-hosted runners is currently not possible; see https://github.com/canonical/inference-snaps-dev/issues/40
        type: string
        default: '[ "self-hosted", "amd64", "xlarge", "noble" ]'
      publish-channel:
        description: Snap Store channel for publishing the snap
        required: true
        type: string
      init-build-script: # Deprecated
        description: |
          Script to run before building the snap. 
          
          Deprecated: Supply a Makefile with 'make init' target instead of passing a script name. 
        required: false
        type: string
    secrets:
      store-credentials:
        description: Snap Store credentials for publishing the snap to the specified channel
        required: true

jobs:
  build:
    name: Build & publish (${{ inputs.runner }})
    runs-on: ${{ fromJSON(inputs.runner) }}

    steps:
      - name: Refresh/Install snapd
        run: |
          sudo snap refresh snapd || sudo snap install snapd

      - name: Install Git LFS
        run: sudo apt-get update && sudo apt-get install -y git-lfs

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Prevent usage of simulated merge commit of PR
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          lfs: true
          submodules: true

      - name: Init build environment
        run: |
          # Try make init
          if [ -f Makefile ]; then
            if make init; then
              exit 0
            else
              # Once deprecated inputs are removed, lack of a "make init" would mean skipping of the initialization.
              echo "Makefile init target failed. Trying other methods..."
            fi
          fi
          
          # Try deprecated download-models.sh script
          if [ -f download-models.sh ]; then
            ./download-models.sh
            exit 0
          fi
          
          # Try custom script if provided via the deprecated input
          if [ -n "${{ inputs.init-build-script }}" ]; then
            ./"${{ inputs.init-build-script }}"
            exit 0
          fi

      - name: Build snap
        uses: canonical/action-build@v1

      - name: Publish snap
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.store-credentials }}     
        run: |
          channel="${{ inputs.publish-channel }}"
          echo -e "Channel:\n\t$channel"

          snap_file="$(ls *.snap)"
          snap_size=$(du -h "$snap_file" | cut -f1)
          echo -e "Snap file:\n\t$snap_file $snap_size"

          # Build components argument list
          component_args=()
          echo "Snap components:"
          for comp_file in *.comp; do
              # When no .comp files exist, bash leaves the glob pattern unexpanded (*.comp). Check if $comp_file exists.
              [ -f "$comp_file" ] || continue

              comp_size=$(du -h "$comp_file" | cut -f1)

              # Component file name patterns:
              # <snap_name>+<comp_name>_<comp_version>.comp
              # <snap_name>+<comp_name>.comp
              comp_name=$(echo "$comp_file" | 
                  cut -d'+' -f2 | # drop snap name
                  cut -d'.' -f1 | # drop file extension
                  cut -d'_' -f1) # split by _, take 1st part

              echo -e "\t$comp_file $comp_size"

              component_args+=(--component "$comp_name=$comp_file")
          done

          echo -e "\nUploading snap..."
          set -x
          snapcraft upload "$snap_file" "${component_args[@]}" --release="$channel"

        # TODO: instead of this, make an action that verifies the release and 
        # reuse also in the build-precheck. 
        # TODO: verify that the existing secret allows revision listing.
      - name: Verify release
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.store-credentials }}
        run: |
          channel="${{ inputs.publish-channel }}"

          snap_file="$(ls *.snap)"

          # Snap file name pattern: <snap_name>_<version>_<arch>.snap
          base="${snap_file%.snap}"
          snap_name="${base%%_*}"
          arch="${base##*_}"
          version="${base#*_}"
          version="${version%_*}"

          echo "Snap name: $snap_name"
          echo "Version:   $version"
          echo "Arch:      $arch"
          echo "Channel:   $channel"

          # 'snapcraft upload' can report success even when the revision is not
          # actually released to the requested channel. Verify by inspecting the
          # revisions list: a released revision shows the channel in the last
          # column, an unreleased one shows '-'.
          revisions="$(snapcraft revisions "$snap_name" --arch "$arch")"
          echo "Revisions for version $version:"
          echo "$revisions" | { grep -F "$version" || true; }

          # It is fine if the version has multiple revisions (e.g. published on a
          # second attempt); we only require that at least one of them is
          # released to a channel (last column is not '-').
          if echo "$revisions" | awk -v ver="$version" '$4 == ver && $NF != "-" { found = 1 } END { exit !found }'; then
            echo "Release verified: version $version is released to a channel."
          else
            echo "Release verification failed: version $version is not released to any channel."
            exit 1
          fi
