# Composite action that runs the AI (agentic) snap test via Workshop & OpenCode.
# It is intended to be called by a snap repository's workflow.
#
# The test scripts and workshop project live alongside this action in the same
# repository (tests/agentic), so they are versioned together with the action
# and no caller checkout is required — the snap under test is pulled from the
# Snap Store by channel.
#
# All log grouping lives here: each phase is wrapped in a named ::group:: so the
# GitHub Actions log renders one collapsible group per phase. The phase scripts
# themselves emit no group markers (they are also run by the agent inside the
# workshop, where such markers would leak and corrupt the log).

name: AI Snap Test via Workshop & OpenCode
description: Run the agentic snap test via Workshop & OpenCode and gate on its verdict.

inputs:
  snap-name:
    description: Name of the snap to test
    required: true
  snap-channel:
    description: Snap Store channel to test
    required: false
    default: edge
  openrouter-model:
    description: OpenRouter model to use for the testing agent
    required: false
    default: deepseek/deepseek-v4-flash
  issue-repo:
    description: Repository where GitHub issues are filed for new findings
    required: false
    default: canonical/inference-snaps
  create-issues:
    description: Automatically file GitHub issues for NEW findings in the tracker repo or label existing ones
    required: false
    default: "false"
  openrouter-api-key:
    description: OpenRouter API key used by the testing agent
    required: true
  issue-create-token:
    description: GitHub token used to create issues in the issue tracker repo
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Resolve the agentic test directory that ships with this action and expose
    # it as an env var so later steps can use it as their working directory and
    # as the workshop project path.
    - name: Resolve agentic test directory
      shell: bash
      run: |
        : Resolve agentic test directory
        TEST_DIR="$(realpath "$GITHUB_ACTION_PATH/../../../tests/agentic")"
        echo "TEST_DIR=$TEST_DIR" >> "$GITHUB_ENV"
        echo "Resolved agentic test directory: $TEST_DIR"

    - name: Launch Workshop
      uses: canonical/launch-workshop@v1
      with:
        project: ${{ env.TEST_DIR }}

    # Phase 1: run the testing agent and produce snap-test-report.json.
    # Exposes `error_count` and `verdict` outputs consumed by later steps.
    - name: Run OpenCode Testing Agent
      id: test
      shell: bash
      working-directory: ${{ env.TEST_DIR }}
      env:
        SNAP_NAME: ${{ inputs.snap-name }}
        SNAP_CHANNEL: ${{ inputs.snap-channel }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        OPENROUTER_MODEL: ${{ inputs.openrouter-model }}
      run: |
        : Run OpenCode Testing Agent
        ./test.sh

    # Phase 2: triage the error findings against open issues, producing
    # snap-triage-report.json. Only runs when the test found error findings.
    - name: Triage findings
      id: triage
      if: steps.test.outputs.error_count > 0
      shell: bash
      working-directory: ${{ env.TEST_DIR }}
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        OPENROUTER_MODEL: ${{ inputs.openrouter-model }}
        ISSUE_REPO: ${{ inputs.issue-repo }}
      run: |
        : Triage findings
        ./triage.sh

    # Phase 3a: summarise DUPLICATE findings (read-only).
    - name: Summarise duplicate issues
      if: steps.test.outputs.error_count > 0 && steps.triage.outcome == 'success'
      shell: bash
      working-directory: ${{ env.TEST_DIR }}
      run: |
        : Summarise duplicate issues
        ./summarise-duplicate-issues.sh

    # Phase 3b: dry-run mode — print NEW findings so they can be filed by hand.
    - name: Print new issues
      if: steps.test.outputs.error_count > 0 && steps.triage.outcome == 'success' && inputs.create-issues != 'true'
      shell: bash
      working-directory: ${{ env.TEST_DIR }}
      env:
        ISSUE_REPO: ${{ inputs.issue-repo }}
      run: |
        : Print new issues
        ./print-new-issues.sh

    # Phase 3c: create mode — file NEW findings as GitHub issues and summarise.
    - name: Create new issues
      if: steps.test.outputs.error_count > 0 && steps.triage.outcome == 'success' && inputs.create-issues == 'true'
      shell: bash
      working-directory: ${{ env.TEST_DIR }}
      env:
        SNAP_NAME: ${{ inputs.snap-name }}
        ISSUE_REPO: ${{ inputs.issue-repo }}
        ISSUE_CREATE_TOKEN: ${{ inputs.issue-create-token }}
      run: |
        : Create new issues
        ./create-new-issues.sh


    # Phase 3d: label existing issues that this run duplicates but that were
    # first detected on a different snap. Create mode only.
    - name: Label cross-snap duplicate issues
      if: steps.test.outputs.error_count > 0 && steps.triage.outcome == 'success' && inputs.create-issues == 'true'
      shell: bash
      working-directory: ${{ env.TEST_DIR }}
      env:
        SNAP_NAME: ${{ inputs.snap-name }}
        ISSUE_REPO: ${{ inputs.issue-repo }}
        ISSUE_CREATE_TOKEN: ${{ inputs.issue-create-token }}
      run: |
        : Label cross-snap duplicate issues
        ./label-cross-snap-duplicates.sh

    # Always tear the workshop down, regardless of earlier failures.
    - name: Remove workshop
      if: always()
      shell: bash
      working-directory: ${{ env.TEST_DIR }}
      run: |
        : Remove workshop
        workshop remove || true

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: snap-test-report
        path: ${{ env.TEST_DIR }}/snap-test-report.json
        # Upload the report as a plain file rather than a zip archive.
        archive: false
        if-no-files-found: warn

    - name: Upload triage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: snap-triage-report
        path: ${{ env.TEST_DIR }}/snap-triage-report.json
        # Upload the report as a plain file rather than a zip archive.
        archive: false
        if-no-files-found: warn

    # Fail the job if the testing agent's verdict was not PASS. Runs last so
    # the reports above are always uploaded first, even on failure.
    - name: Enforce test verdict
      if: always()
      shell: bash
      working-directory: ${{ env.TEST_DIR }}
      run: |
        : Enforce test verdict
        VERDICT="${{ steps.test.outputs.verdict }}"
        echo "Verdict: $VERDICT"
        if [[ "$VERDICT" != "PASS" ]]; then
          echo "::error::Test FAILED (verdict: $VERDICT)"
          exit 1
        fi

